# Compiles the resume from the Overleaf-synced GitHub repo and updates the site PDF.
# After editing in Overleaf: Menu → GitHub → Push Overleaf changes to GitHub,
# then this workflow picks it up on the next hourly run (or Run workflow).
#
# Secret required (private resume repo):
#   RESUME_REPO_TOKEN — fine-grained PAT with Contents: Read on Lakshay-Sharma-Resume
#   (classic PAT with `repo` scope also works)
#
# If compile fails, set ROOT_FILE / engine to match Overleaf Menu → Settings.

name: Sync resume from Overleaf

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  RESUME_REPO: lakshaysharma2005/Lakshay-Sharma-Resume
  ROOT_FILE: main.tex
  # pdfLaTeX (default). For XeLaTeX set USE_XELATEX=true; for LuaLaTeX set USE_LUALATEX=true.
  USE_XELATEX: 'false'
  USE_LUALATEX: 'false'

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout resume source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RESUME_REPO }}
          path: resume-src
          token: ${{ secrets.RESUME_REPO_TOKEN }}

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.ROOT_FILE }}
          working_directory: resume-src
          latexmk_use_xelatex: ${{ env.USE_XELATEX }}
          latexmk_use_lualatex: ${{ env.USE_LUALATEX }}

      - name: Copy PDF into public/
        run: |
          set -euo pipefail
          stem="${ROOT_FILE%.tex}"
          src="resume-src/${stem}.pdf"
          if [ ! -f "$src" ]; then
            echo "Compiled PDF not found at $src"
            ls -la resume-src || true
            exit 1
          fi
          cp "$src" public/Lakshay_Sharma_Resume.pdf

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Lakshay_Sharma_Resume.pdf
          if git diff --staged --quiet; then
            echo "Resume PDF unchanged."
            exit 0
          fi
          git commit -m "Update resume PDF from Overleaf"
          git push
